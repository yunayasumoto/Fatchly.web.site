<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Fetchly — 検索デモ</title>
<style>
  :root{
    --blue:#1a0dab;
    --green:#006621;
    --text:#202124;
    --gray:#5f6368;
    --border:#ebebeb;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family: arial, "Hiragino Sans", "Meiryo", sans-serif;
    color:var(--text);
    background:#fff;
  }
  a{text-decoration:none;color:inherit;}

  /* ---------- Home (centered) state ---------- */
  #home{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:0 20px;
  }
  .logo{
    font-size:64px;
    font-weight:700;
    letter-spacing:-1px;
    margin-bottom:28px;
    user-select:none;
  }
  .logo span:nth-child(1){color:#4285F4;}
  .logo span:nth-child(2){color:#EA4335;}
  .logo span:nth-child(3){color:#FBBC05;}
  .logo span:nth-child(4){color:#4285F4;}
  .logo span:nth-child(5){color:#34A853;}
  .logo span:nth-child(6){color:#EA4335;}
  .logo span:nth-child(7){color:#FBBC05;}

  .search-box{
    width:100%;
    max-width:560px;
    display:flex;
    align-items:center;
    gap:10px;
    border:1px solid #dfe1e5;
    border-radius:24px;
    padding:11px 18px;
    transition:box-shadow .15s ease, border-color .15s ease;
  }
  .search-box:hover, .search-box:focus-within{
    box-shadow:0 1px 6px rgba(32,33,36,0.28);
    border-color:rgba(223,225,229,0);
  }
  .search-box svg{flex:none;color:var(--gray);}
  .search-box input{
    flex:1;
    border:none;
    outline:none;
    font-size:16px;
    color:var(--text);
    background:transparent;
  }

  .btn-row{
    margin-top:28px;
    display:flex;
    gap:12px;
  }
  .btn{
    background:#f8f9fa;
    border:1px solid #f8f9fa;
    border-radius:4px;
    color:#3c4043;
    font-size:14px;
    padding:9px 16px;
    cursor:pointer;
  }
  .btn:hover{
    border-color:#dadce0;
    box-shadow:0 1px 1px rgba(0,0,0,0.06);
  }

  .home-footer{
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    background:#f2f2f2;
    border-top:1px solid var(--border);
    padding:14px 26px;
    font-size:13px;
    color:var(--gray);
    display:flex;
    justify-content:space-between;
  }

  /* ---------- Results state ---------- */
  #results-page{
    display:none;
  }
  .topbar{
    display:flex;
    align-items:center;
    gap:34px;
    padding:18px 26px 14px;
    border-bottom:1px solid var(--border);
  }
  .topbar .logo-sm{
    font-size:24px;
    font-weight:700;
    letter-spacing:-0.5px;
    flex:none;
  }
  .topbar .logo-sm span:nth-child(1){color:#4285F4;}
  .topbar .logo-sm span:nth-child(2){color:#EA4335;}
  .topbar .logo-sm span:nth-child(3){color:#FBBC05;}
  .topbar .logo-sm span:nth-child(4){color:#4285F4;}
  .topbar .logo-sm span:nth-child(5){color:#34A853;}
  .topbar .logo-sm span:nth-child(6){color:#EA4335;}
  .topbar .logo-sm span:nth-child(7){color:#FBBC05;}

  .topbar .search-box{max-width:560px; padding:9px 16px;}
  .topbar .search-box input{font-size:15px;}

  .stats{
    padding:14px 26px 6px;
    font-size:13px;
    color:var(--gray);
    max-width:640px;
  }

  .result-list{
    padding:0 26px;
    max-width:640px;
  }
  .result{
    padding:16px 0;
  }
  .result .url{
    font-size:13px;
    color:var(--green);
    margin-bottom:2px;
  }
  .result .r-title{
    font-size:19px;
    color:var(--blue);
    margin-bottom:4px;
    display:inline-block;
    cursor:pointer;
    -webkit-tap-highlight-color:rgba(26,13,171,0.15);
    padding:6px 0;
    margin:-6px 0 -2px;
  }
  .result .r-title:hover{text-decoration:underline;}
  .result .r-title:active{text-decoration:underline;}

  .toast{
    position:fixed;
    left:50%;
    bottom:24px;
    transform:translateX(-50%) translateY(20px);
    background:#202124;
    color:#fff;
    font-size:13px;
    padding:10px 18px;
    border-radius:6px;
    opacity:0;
    pointer-events:none;
    transition:opacity .2s ease, transform .2s ease;
    z-index:10;
    white-space:nowrap;
  }
  .toast.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
  }
  .result .snippet{
    font-size:14px;
    line-height:1.55;
    color:#4d5156;
    max-width:600px;
  }
  .result mark{
    background:none;
    font-weight:700;
    color:inherit;
  }

  .empty{
    padding:60px 26px;
    color:var(--text);
    font-size:15px;
  }
  .empty b{font-weight:700;}
  .empty ul{color:var(--gray); font-size:14px; margin-top:14px;}

  @media (max-width:480px){
    .logo{font-size:46px;}
    .topbar{gap:16px; padding:14px 14px;}
    .result-list, .stats{padding-left:14px; padding-right:14px;}
  }
</style>
</head>
<body>

<!-- HOME -->
<div id="home">
  <div class="logo"><span>F</span><span>e</span><span>t</span><span>c</span><span>h</span><span>l</span><span>y</span></div>
  <form id="homeForm" style="width:100%; max-width:560px;">
    <div class="search-box">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="text" id="homeInput" autocomplete="off" autofocus>
    </div>
    <div class="btn-row" style="justify-content:center;">
      <button type="submit" class="btn">Fetchly 検索</button>
      <button type="button" class="btn" id="luckyBtn">ラッキー検索</button>
    </div>
  </form>
  <div class="home-footer">
    <span>Japan</span>
    <span>ダミーデータのみのデモです — 実際のウェブ検索は行いません</span>
  </div>
</div>

<!-- RESULTS -->
<div id="results-page">
  <div class="topbar">
    <div class="logo-sm"><span>F</span><span>e</span><span>t</span><span>c</span><span>h</span><span>l</span><span>y</span></div>
    <form id="resultsForm" style="flex:1; display:flex;">
      <div class="search-box" style="flex:1;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" id="resultsInput" autocomplete="off">
      </div>
    </form>
  </div>
  <div class="stats" id="stats"></div>
  <div class="result-list" id="resultList"></div>
</div>

<div class="toast" id="toast">これはデモです。実際のページは開けません</div>

<script>

  {t:"多摩川源流を歩く：三日間の記録", u:"trailnotes.example/tamagawa-source", s:"奥多摩の水源地帯から河口までを歩いた記録。標高差と植生の変化を写真とともに振り返ります。"},
  {t:"中古レコードの見分け方入門", u:"waxandgroove.example/vinyl-grading", s:"盤面の傷、レーベルの刷り、内袋の状態からプレスの年代を推測する基本的なチェックポイント。"},

  {t:"苔テラリウムの作り方と管理", u:"greenjar.example/moss-terrarium-guide", s:"密閉容器の中で苔が自立した生態系を保つ理由と、水やりの頻度についての実践的なコツ。"},

  {t:"手漉き和紙の繊維構造", u:"papercraftnotes.example/washi-fiber-structure", s:"楮の繊維がどのように絡み合って強度を生むのか、顕微鏡写真を交えて解説します。"},

  {t:"発酵茶と非発酵茶の違いを飲み比べる", u:"teahouse.example/fermented-vs-green", s:"プーアル茶と緑茶を同じ茶葉量で淹れ、香りと渋みの出方を比較したテイスティング記録。"},

  {t:"古い腕時計のゼンマイを巻く頻度", u:"timepiece.example/mainspring-winding", s:"手巻き式ムーブメントを長持ちさせるための、巻き上げ回数と保管姿勢についての目安。"},

  {t:"古書の虫食い跡を修復する", u:"bookbindery.example/insect-damage-repair", s:"和紙と小麦粉糊を使った伝統的な補修方法と、現代の保存科学との違いについて。"},

  {t:"不妊治療にまつわる情報との距離の取り方", u:"lifestepnotes.example/distance-from-information", s:"調べすぎて疲れてしまった経験から、情報とどう付き合うようにしたかを振り返る内容です。"},
  {t:"義理の両親との関わり方で悩んだこと", u:"workingdiary.example/in-laws-and-boundaries", s:"聞かれたくないことを聞かれたときに、どう距離を置くようにしていたかについての記録。"}
];

const home = document.getElementById('home');
const resultsPage = document.getElementById('results-page');
const homeForm = document.getElementById('homeForm');
const homeInput = document.getElementById('homeInput');
const resultsForm = document.getElementById('resultsForm');
const resultsInput = document.getElementById('resultsInput');
const luckyBtn = document.getElementById('luckyBtn');
const stats = document.getElementById('stats');
const resultList = document.getElementById('resultList');

function highlight(text, q){
  if(!q) return text;
  const idx = text.toLowerCase().indexOf(q.toLowerCase());
  if(idx === -1) return text;
  return text.slice(0,idx) + '<mark>' + text.slice(idx, idx+q.length) + '</mark>' + text.slice(idx+q.length);
}

function runSearch(query){
  const q = query.trim();
  home.style.display = 'none';
  resultsPage.style.display = 'block';
  resultsInput.value = q;

  const matches = q
    ? DATA.filter(d => (d.t + d.s).toLowerCase().includes(q.toLowerCase()))
    : DATA;

  stats.textContent = `約 ${matches.length} 件 (0.${20 + (q.length*7)%60} 秒)`;

  if(matches.length === 0){
    resultList.innerHTML = `
      <div class="empty">
        <b>「${q}」に一致する情報は見つかりませんでした。</b>
        <ul>
          <li>キーワードのスペルを確認してください</li>
          <li>別のキーワードを試してください</li>
          <li>より一般的な言葉で検索してください</li>
        </ul>
      </div>`;
    return;
  }

  resultList.innerHTML = matches.map(d => `
    <div class="result">
      <div class="url">${d.u}</div>
      <a href="#" class="r-title" onclick="showToast(event)">${highlight(d.t, q)}</a>
      <div class="snippet">${highlight(d.s, q)}</div>
    </div>
  `).join('');
}

let toastTimer;
function showToast(e){
  e.preventDefault();
  const toast = document.getElementById('toast');
  toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove('show'), 1800);
}

homeForm.addEventListener('submit', e => {
  e.preventDefault();
  runSearch(homeInput.value);
});
resultsForm.addEventListener('submit', e => {
  e.preventDefault();
  runSearch(resultsInput.value);
});
resultsInput.addEventListener('input', () => runSearch(resultsInput.value));
luckyBtn.addEventListener('click', () => {
  const pick = DATA[Math.floor(Math.random()*DATA.length)];
  runSearch(pick.t);
});

runSearch('不妊治療');
</script>
